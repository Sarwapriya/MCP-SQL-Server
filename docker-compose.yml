services:

  # ── MCP MSSQL Server ───────────────────────────────────────
  mcp-mssql:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: mcp-mssql
    restart: unless-stopped

    ports:
      # Bound to loopback only: reachable from other processes/containers on
      # this VM (and from nginx for the public route) but never directly from
      # the network. Public access must go through nginx's token-checked proxy.
      - "127.0.0.1:8000:8000"

    environment:
      # ── SQL Server connection ────────────────────────────────
      MSSQL_SERVER: ${MSSQL_SERVER}
      MSSQL_DATABASE: ${MSSQL_DATABASE}
      MSSQL_USERNAME: ${MSSQL_USERNAME}
      MSSQL_PASSWORD: ${MSSQL_PASSWORD}
      MSSQL_PORT: ${MSSQL_PORT:-1433}
      MSSQL_DRIVER: ${MSSQL_DRIVER:-ODBC Driver 18 for SQL Server}
      MSSQL_ENCRYPT: ${MSSQL_ENCRYPT:-false}
      MSSQL_TRUST_SERVER_CERT: ${MSSQL_TRUST_SERVER_CERT:-true}

      # ── Connection pool ──────────────────────────────────────
      POOL_SIZE: ${POOL_SIZE:-10}
      POOL_MAX_OVERFLOW: ${POOL_MAX_OVERFLOW:-20}
      POOL_TIMEOUT: ${POOL_TIMEOUT:-30}
      POOL_RECYCLE: ${POOL_RECYCLE:-3600}

      # ── Query safety ─────────────────────────────────────────
      MAX_ROWS: ${MAX_ROWS:-10000}
      QUERY_TIMEOUT: ${QUERY_TIMEOUT:-120}
      ALLOW_WRITE_OPERATIONS: ${ALLOW_WRITE_OPERATIONS:-false}

      # ── Redis cache ──────────────────────────────────────────
      REDIS_ENABLED: "true"
      REDIS_URL: "redis://redis:6379"
      SCHEMA_CACHE_TTL: ${SCHEMA_CACHE_TTL:-3600}

      # ── Server ───────────────────────────────────────────────
      TRANSPORT: "streamable-http"    # ← changed from "sse"
      HOST: "0.0.0.0"
      PORT: "8000"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"

    env_file:
      - .env

    depends_on:
      redis:
        condition: service_healthy

    networks:
      - mcp-network
      # Shares a network with the ax-hub-gateway nginx container (from the
      # separate formiq app stack) so nginx can reach this container by name
      # ("mcp-mssql") for the public /mcp-sql/ route. Network is created by
      # that other stack — declared external below, not owned by this one.
      - formiq-net

    extra_hosts:
      - "host.docker.internal:host-gateway"

    # ── Healthcheck ───────────────────────────────────────────
    # FastMCP streamable-http's real endpoint is /mcp (no trailing slash) —
    # GET /mcp/ 307-redirects to /mcp, and a bare GET /mcp returns 400 (wrong
    # request shape for a real MCP call, but proves the server is up).
    healthcheck:
      test: [
        "CMD-SHELL",
        "curl -sf -o /dev/null -w '%{http_code}' http://localhost:8000/mcp | grep -qE '(200|307|400|405|406)'"
      ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── Redis (Schema Cache) ────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: mcp-mssql-redis
    restart: unless-stopped

    # No published port: only mcp-mssql needs this, reached over the internal
    # mcp-network by service name ("redis"). Nothing external should ever
    # need to reach Redis directly, and it has no auth configured.
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save ""
      --appendonly no

    networks:
      - mcp-network

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

networks:
  mcp-network:
    driver: bridge
    name: mcp-network
  formiq-net:
    external: true